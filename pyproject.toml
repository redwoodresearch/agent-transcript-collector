[project]
name = "agent-transcript-collector"
version = "0.1.0"
description = "Collect and share AI coding-agent transcripts (Claude Code, Codex, Cursor, Pi) with consent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "boto3>=1.35",
    "textual>=0.50",
]

[project.scripts]
rr-trans = "agent_transcript_collector.cli:main"
agent-transcript-watcher = "agent_transcript_collector.watcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]
