[project]
name = "agent-transcript-collector"
version = "0.1.0"
description = "Collect and share AI coding-agent transcripts (Claude Code, Codex, Cursor, Pi) with consent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "boto3>=1.35",
    "textual>=0.50",
    "harbor==0.20.0",
]

[project.scripts]
rr-trans = "agent_transcript_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
